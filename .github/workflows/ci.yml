# CI de festa-infra (SCRUM-44).
# 1) Escaneo de secretos y vulnerabilidades (Trivy) y CodeQL del validador: workflow reutilizable de la organización.
# 2) Contratos de mensajería, linter de scripts y validación de docker-compose.yml.
# 3) Levanta la infraestructura y verifica una BD por servicio, el aislamiento y la topología de RabbitMQ.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seguridad:
    uses: Desparcha2-SWNT/.github/.github/workflows/ci-reusable.yml@main
    # El workflow llamado no puede pedir más permisos que este job (su job de CodeQL pide security-events).
    permissions:
      contents: read
      security-events: write
    with:
      enable-codeql: true
      codeql-language: javascript-typescript

  validacion:
    name: Contratos, linter y compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Contratos de mensajería
        working-directory: contracts
        run: |
          npm ci
          npm run validate

      # Falla con avisos de nivel warning o error; los de estilo (info) no bloquean.
      - name: Linter (ShellCheck)
        run: shellcheck --severity=warning scripts/*.sh postgres/init/*.sh mongo/init/*.sh

      # Valida la sintaxis y las variables de todos los perfiles con los valores de ejemplo.
      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          for perfil in "" "--profile all" "--profile tunnel"; do
            docker compose $perfil config -q
          done

  integracion:
    name: Infraestructura levanta y queda aislada
    needs: validacion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar .env y secretos de prueba
        run: |
          cp .env.example .env
          ./scripts/gen-secrets.sh

      - name: Levantar la infraestructura
        run: |
          docker compose up -d
          for _ in $(seq 1 60); do
            healthy=$(docker compose ps --format '{{.Service}} {{.Health}}' | grep -c ' healthy$' || true)
            topo=$(docker compose ps -a --format '{{.Service}} {{.State}} {{.ExitCode}}' | grep -c '^rabbitmq-topology exited 0$' || true)
            if [ "$healthy" -ge 4 ] && [ "$topo" = 1 ]; then
              docker compose ps -a
              exit 0
            fi
            sleep 5
          done
          docker compose ps -a
          exit 1

      - name: Verificar la infraestructura
        run: ./scripts/ci-check.sh

      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs --no-color --tail 80

      - name: Apagar
        if: always()
        run: docker compose down -v

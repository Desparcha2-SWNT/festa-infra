# Ajustes para máquinas con poca RAM (el piloto corre en portátiles de estudiantes).
# Tope de memoria: al llegar aquí RabbitMQ frena a los publicadores en vez de tumbar la máquina.
vm_memory_high_watermark.absolute = 256MiB
disk_free_limit.absolute = 200MiB
# La UI de management no necesita guardar historial de estadísticas.
collect_statistics_interval = 30000
management.rates_mode = none

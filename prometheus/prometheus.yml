global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']

  - job_name: kong
    static_configs:
      - targets: ['gateway:8100']

  # Los servicios que aún no estén levantados aparecen como "down"; es esperado.
  - job_name: festa-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth-service:8081
          - user-service:8082
          - event-service:8083
          - booking-service:8084
          - payment-service:8085
          - ai-service:8086
          - notification-service:8087
          - analytics-service:8088
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: service
